# All routes are client-side (/superboard, /invite/:token), so unknown paths
# fall back to index.html. The dashboard is operator-only: never index it.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        # No immutable: the backend URL is stamped into these files at
        # container start, so the same hashed filename can change between
        # deploys. Revalidate every time instead of risking a stale bundle.
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }
}
